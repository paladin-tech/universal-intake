  - id: UINT-002
    title: Scaffold Next.js application and initial intake engine
    status: done
    priority: high
    created: 2026-05-23
    updated: 2026-05-23
    objective: Create the initial Next.js full-stack application with a minimal UI, API route, workflow registry, and schema-bound intake engine skeleton.
    scope:
      - Scaffold a Next.js TypeScript application in the repository.
      - Add Zod for workflow schema definitions and deterministic validation.
      - Create an intake API endpoint that accepts workflowId and free-form input.
      - Create a minimal demo UI for selecting a workflow and submitting intake text.
      - Add example insurance quote and cargo record workflows.
      - Keep AI provider integration abstracted or stubbed until credentials/provider are selected.
    deliverables:
      - package.json
      - Next.js app structure
      - intake API route
      - minimal intake UI
      - workflow registry
      - example workflow schemas
    acceptance_criteria:
      - App installs and type-checks.
      - UI can submit a sample intake request.
      - API validates workflowId and input.
      - Runtime-known workflow selection is preserved.
      - Unknown workflows return a deterministic error.
      - Example workflows are available through the registry.
    decisions:
      - D-UINT-002-01
      - D-UINT-002-02
    challenges:
      - CH-UINT-002-01
